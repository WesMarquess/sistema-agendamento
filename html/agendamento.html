    <main>
        <div class="form-container">
            <h2>Crie sua conta</h2>

            <form id="form"class="formulario">
                
                <label for="input-nome">Nome</label>
                <input type="text" id="input-nome" placeholder="Digite seu nome" required>

                <label for="input-telefone">Telefone</label>
                <input type="tel" id="input-telefone" placeholder="Digite seu telefone" required>

                <label for="input-email">Email</label>
                <input type="email" id="input-email" placeholder="Digite seu email" required>

                <label for="input-senha">Senha</label>
                <input type="password" id="input-senha" placeholder="Digite sua senha" required>

                <button type="submit">Cadastrar</button>

            </form>
        </div>
    </main>
    <script src="../script.js"></script>
</body>
