<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamento</title>

    <link rel="stylesheet" href="../styles/agendamento.css">
    <link rel="stylesheet" href="../styles/menu.css">

<body>

    <header>

                <li><a href="index.html">Home</a></li>

                <li><a href="agendamento.html">Agendamento</a></li>
                <li id="menu-login"><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <div class="form-container">
            <h2>Agendar Horário</h2>

            <form id="form-agendamento" class="formulario">

                <div class="campo">
                    <label>Serviço</label>
                    <select id="servico" required>
                        <option value="">Selecione um serviço</option>
                        <option value="Manicure" data-valor="40">Manicure</option>
                        <option value="Pedicure" data-valor="50">Pedicure</option>
                        <option value="Pe e Mao" data-valor="65">Pé e Mão</option>
                        <option value="Escova" data-valor="50">Escova</option>
                        <option value="Progressiva" data-valor="100">Progressiva</option>
                        <option value="Botox" data-valor="90">Botox Capilar</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Valor</label>
                    <input type="text" id="valor" readonly>
                </div>

                <div class="campo">
                    <label>Profissional</label>
                    <select id="profissional" required>
                        <option value="">Selecione</option>
                    </select>
                </div>

                <div class="campo">
                    <label>Data</label>
                    <input type="date" id="data" required>
                </div>

                <div class="campo">
                    <label>Hora</label>
                    <select id="hora" required>
                        <option value="">Selecione o horário</option>
                    </select>
                </div>

                <button type="submit">Agendar</button>

            </form>
        </div>

        <script>
            const usuario = JSON.parse(localStorage.getItem("usuario"));
            if (usuario.role === "profissional") {
            } else {
            }
        </script>

    </main>

    <script src="../agendamento.js"></script>

</html>
